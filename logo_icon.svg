<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 64px; fill: #0F172A; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #64748B; letter-spacing: 2px; }
    </style>
  </defs>
  
  <!-- Icono: brackets + nodos conectados -->
  <g transform="translate(256, 180)">
    <!-- Líneas de conexión -->
    <line x1="-60" y1="0" x2="0" y2="-50" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="-50" x2="60" y2="0" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
    <line x1="60" y1="0" x2="0" y2="50" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="50" x2="-60" y2="0" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
    <!-- Nodos -->
    <circle cx="-60" cy="0" r="14" fill="url(#grad1)"/>
    <circle cx="0" cy="-50" r="14" fill="url(#grad1)"/>
    <circle cx="60" cy="0" r="14" fill="url(#grad1)"/>
    <circle cx="0" cy="50" r="14" fill="url(#grad1)"/>
    <circle cx="0" cy="0" r="18" fill="url(#grad1)"/>
    <!-- Brackets de código -->
    <path d="M -90 -30 L -110 0 L -90 30" stroke="url(#grad1)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 90 -30 L 110 0 L 90 30" stroke="url(#grad1)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Wordmark -->
  <text x="256" y="340" text-anchor="middle" class="title">INCODENCIA</text>
  <text x="256" y="375" text-anchor="middle" class="subtitle">SISTEMAS • APPS • WEBS</text>
</svg>
